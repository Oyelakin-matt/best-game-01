<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Void — a neon space shooter</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050510; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* Touch controls: hidden unless the page runs on a touch device (body.touch,
     added by main.js). They are DOM, never canvas, so desktop play and the
     staged screenshots stay exactly as they were. */
  #touch-ui { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  body.touch #touch-ui { display: block; }
  #joy-base { position: absolute; width: 112px; height: 112px; border: 2px solid rgba(0,240,255,0.45); border-radius: 50%; background: rgba(0,240,255,0.06); display: none; transform: translate(-50%, -50%); }
  #joy-knob { position: absolute; width: 48px; height: 48px; left: 32px; top: 32px; border-radius: 50%; background: rgba(0,240,255,0.55); box-shadow: 0 0 16px rgba(0,240,255,0.8); }
  #fire-ring { position: absolute; width: 84px; height: 84px; border: 2px solid rgba(255,45,149,0.55); border-radius: 50%; background: rgba(255,45,149,0.08); display: none; transform: translate(-50%, -50%); }
</style>
</head>
<body>
<canvas id="game" aria-label="Neon Void: fly the ship, shoot the void, survive the waves"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="touch-ui" aria-hidden="true">
  <div id="joy-base"><div id="joy-knob"></div></div>
  <div id="fire-ring"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
